name: Check generated pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated HTML is up to date with src/ and the dictionaries
        run: node scripts/build.mjs --check
